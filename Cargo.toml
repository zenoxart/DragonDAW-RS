[workspace]
resolver = "2"
members = [
    "crates/shared/monads",
    "crates/shared/contracts",
    "crates/client/framework",
    "crates/engine",
    "crates/app",
    "crates/test-plugins",
    "tools/dragon-cli",
]
default-members = [
    "crates/shared/monads",
    "crates/shared/contracts",
    "crates/client/framework",
    "crates/engine",
    "crates/app",
    "tools/dragon-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ZenoxArt"]
repository = "https://github.com/zenoxart/RedHiveFramework"
rust-version = "1.89"

[workspace.dependencies]
redhive-monads = { path = "crates/shared/monads" }
redhive-contracts = { path = "crates/shared/contracts" }
redhive-client-framework = { path = "crates/client/framework" }
dragon-engine = { path = "crates/engine" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
