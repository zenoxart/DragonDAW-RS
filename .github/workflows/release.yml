name: Release

# Continuous delivery:
# - every push to `main` that passes CI is built for Windows, Linux and macOS and published as the
#   rolling `nightly` pre-release (replaced on each run);
# - a version tag (e.g. `git tag v2.1.0 && git push --tags`) builds the same archives and publishes
#   them as a versioned GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Nightly only after a green CI run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: linux-x86_64
            os: ubuntu-latest
            # Built on Ubuntu 22.04 (glibc 2.35) so it runs on older distributions too; ubuntu-latest's
            # glibc made the binary refuse to start on anything older than itself.
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates git pkg-config libasound2-dev cmake clang xz-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        env:
          # What the build is, for its update check (see crates/app/build.rs).
          DRAGON_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DRAGON_BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'nightly' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # ASIO: asio-sys fetches Steinberg's ASIO SDK and runs bindgen on it with the runner's LLVM.
            # (Only here: an empty LIBCLANG_PATH breaks coreaudio-sys on macOS.)
            export LIBCLANG_PATH="C:\\Program Files\\LLVM\\bin"
            # With ASIO drivers; should the ASIO SDK be unreachable, still ship a build (WASAPI only).
            cargo build --release --locked --target ${{ matrix.target }} -p dragon-daw -p dragon-cli --features dragon-daw/asio \
              || { echo "::warning::ASIO build failed - building without ASIO"; cargo build --release --locked --target ${{ matrix.target }} -p dragon-daw -p dragon-cli; }
          else
            cargo build --release --locked --target ${{ matrix.target }} -p dragon-daw -p dragon-cli
          fi
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="nightly-${SHA::7}"
          DIR="dragon-daw-${VERSION}-${{ matrix.name }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/dragon-daw${{ matrix.ext }}" "$DIR/"
          cp "target/${{ matrix.target }}/release/dragon${{ matrix.ext }}" "$DIR/"
          cp README.md LICENSE NOTICE "$DIR/"
          [ -d crates/app/assets ] && cp -r crates/app/assets "$DIR/assets" || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Video import needs ffmpeg: ship the LGPL build next to the app (found in ffmpeg\ beside it).
            curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip \
              && 7z x -offmpeg-src ffmpeg.zip > /dev/null \
              && mkdir -p "$DIR/ffmpeg" \
              && cp ffmpeg-src/*/bin/ffmpeg.exe ffmpeg-src/*/bin/ffprobe.exe "$DIR/ffmpeg/" \
              && cp ffmpeg-src/*/LICENSE.txt "$DIR/ffmpeg/LICENSE-ffmpeg.txt" \
              || echo "::warning::ffmpeg could not be bundled (video import will offer to download it)"
            7z a -tzip "$DIR.zip" "$DIR" > /dev/null
            echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
          else
            if [ "${{ runner.os }}" = "Linux" ]; then
              # Ship ffmpeg on Linux too (BtbN's static LGPL build), found in ffmpeg/ beside the app.
              curl -fsSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz \
                && mkdir -p ffmpeg-src && tar -xJf ffmpeg.tar.xz -C ffmpeg-src \
                && mkdir -p "$DIR/ffmpeg" \
                && cp ffmpeg-src/*/bin/ffmpeg ffmpeg-src/*/bin/ffprobe "$DIR/ffmpeg/" \
                && cp ffmpeg-src/*/LICENSE.txt "$DIR/ffmpeg/LICENSE-ffmpeg.txt" \
                || echo "::warning::ffmpeg could not be bundled (video import will offer to download it)"
            fi
            tar czf "$DIR.tar.gz" "$DIR"
            echo "ASSET=$DIR.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  nightly:
    name: Publish nightly
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Replace the nightly release
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --latest=false \
            --title "Nightly (main @ ${SHA::7})" \
            --notes "Automatic build of \`main\` at ${SHA} after a green CI run. For testing; use a versioned release for production."
