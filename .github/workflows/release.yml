name: Release

# Continuous delivery:
# - every push to `main` that passes CI is built for Windows, Linux and macOS and published as the
#   rolling `nightly` pre-release (replaced on each run);
# - a version tag (e.g. `git tag v2.1.0 && git push --tags`) builds the same archives and publishes
#   them as a versioned GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nightly runs queue instead of cancelling each other: a run cancelled between deleting the old
# nightly and publishing the new one would leave no download at all. GitHub keeps only the newest
# waiting run, so a burst of pushes still builds just the latest commit after the current one.
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'nightly' || github.ref }}
  cancel-in-progress: false

# Security: no permissions by default; each job gets only what it needs. All actions are pinned
# to commit SHAs (tags can be moved by their owners); Dependabot keeps the pins up to date.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Nightly only after a green CI run of a *push to main in this repository*.
    # Security: CI also runs for pull requests, including from forks, and `branches: [main]` above
    # only compares the branch *name*, which a fork can also call `main`. Without these checks a
    # stranger's pull request would be built here and published as the official nightly.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: linux-x86_64
            os: ubuntu-latest
            # Built on Ubuntu 22.04 (glibc 2.35) so it runs on older distributions too; ubuntu-latest's
            # glibc made the binary refuse to start on anything older than itself.
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false # the build runs crate build scripts; don't leave a token in .git
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates git pkg-config libasound2-dev cmake clang xz-utils
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; pinned, so the toolchain is given via `toolchain:`
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        env:
          # What the build is, for its update check (see crates/app/build.rs).
          DRAGON_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DRAGON_BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'nightly' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # ASIO: asio-sys fetches the ASIO SDK and runs bindgen on it with the runner's LLVM.
            # (Only here: an empty LIBCLANG_PATH breaks coreaudio-sys on macOS.)
            export LIBCLANG_PATH="C:\\Program Files\\LLVM\\bin"
            # With ASIO drivers; should the ASIO SDK be unreachable, still ship a build (WASAPI only).
            cargo build --release --locked --target ${{ matrix.target }} -p dragon-daw -p dragon-cli --features dragon-daw/asio \
              || { echo "::warning::ASIO build failed - building without ASIO"; cargo build --release --locked --target ${{ matrix.target }} -p dragon-daw -p dragon-cli; }
          else
            cargo build --release --locked --target ${{ matrix.target }} -p dragon-daw -p dragon-cli
          fi
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="nightly-${SHA::7}"
          DIR="dragon-daw-${VERSION}-${{ matrix.name }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/dragon-daw${{ matrix.ext }}" "$DIR/"
          cp "target/${{ matrix.target }}/release/dragon${{ matrix.ext }}" "$DIR/"
          cp README.md LICENSE NOTICE "$DIR/"
          [ -d crates/app/assets ] && cp -r crates/app/assets "$DIR/assets" || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Video import needs ffmpeg: ship the LGPL build next to the app (found in ffmpeg\ beside it).
            curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip \
              && curl -fsSL -o ffmpeg.sums https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256 \
              && grep ' ffmpeg-master-latest-win64-lgpl.zip$' ffmpeg.sums | sed 's/ ffmpeg-master-latest-win64-lgpl.zip$/ ffmpeg.zip/' | sha256sum -c - \
              && 7z x -offmpeg-src ffmpeg.zip > /dev/null \
              && mkdir -p "$DIR/ffmpeg" \
              && cp ffmpeg-src/*/bin/ffmpeg.exe ffmpeg-src/*/bin/ffprobe.exe "$DIR/ffmpeg/" \
              && cp ffmpeg-src/*/LICENSE.txt "$DIR/ffmpeg/LICENSE-ffmpeg.txt" \
              || echo "::warning::ffmpeg could not be bundled (video import will offer to download it)"
            7z a -tzip "$DIR.zip" "$DIR" > /dev/null
            echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
          else
            if [ "${{ runner.os }}" = "Linux" ]; then
              # Ship ffmpeg on Linux too (BtbN's static LGPL build), found in ffmpeg/ beside the app.
              curl -fsSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz \
                && curl -fsSL -o ffmpeg.sums https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256 \
                && grep ' ffmpeg-master-latest-linux64-lgpl.tar.xz$' ffmpeg.sums | sed 's/ ffmpeg-master-latest-linux64-lgpl.tar.xz$/ ffmpeg.tar.xz/' | sha256sum -c - \
                && mkdir -p ffmpeg-src && tar -xJf ffmpeg.tar.xz -C ffmpeg-src \
                && mkdir -p "$DIR/ffmpeg" \
                && cp ffmpeg-src/*/bin/ffmpeg ffmpeg-src/*/bin/ffprobe "$DIR/ffmpeg/" \
                && cp ffmpeg-src/*/LICENSE.txt "$DIR/ffmpeg/LICENSE-ffmpeg.txt" \
                || echo "::warning::ffmpeg could not be bundled (video import will offer to download it)"
            fi
            tar czf "$DIR.tar.gz" "$DIR"
            echo "ASSET=$DIR.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build attestation
      attestations: write  # store it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # Signed proof that these files were built by this workflow from this repository.
      # Check a download with: gh attestation verify <file> --repo zenoxart/DragonDAW-RS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.zip, dist/*.tar.gz'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  nightly:
    name: Publish nightly
    needs: build
    # same guard as the build job (needs: build is skipped for foreign runs, this makes it explicit)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write      # replace the nightly release
      id-token: write      # sign the build attestation
      attestations: write  # store it
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # Signed proof that these files were built by this workflow from this repository.
      # Check a download with: gh attestation verify <file> --repo zenoxart/DragonDAW-RS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.zip, dist/*.tar.gz'
      - name: Replace the nightly release
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          # Remove every existing `nightly` release, including drafts left behind by an earlier
          # run (`gh release delete` only finds one), then point the tag at the new commit.
          gh api "repos/$REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "nightly") | .id' |
            while read -r id; do echo "Deleting old nightly release $id"; gh api -X DELETE "repos/$REPO/releases/$id"; done
          gh api -X DELETE "repos/$REPO/git/refs/tags/nightly" >/dev/null 2>&1 || true
          gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null

          gh release create nightly dist/* --repo "$REPO" --verify-tag --prerelease --latest=false \
            --title "Nightly (main @ ${SHA::7})" \
            --notes "Automatic build of \`main\` at ${SHA} after a green CI run. For testing; use a versioned release for production."

          # `gh release create` uploads into a draft and publishes at the end. That last step has
          # silently failed before (the nightly stayed a draft = "Not Found" for every visitor),
          # so check it, publish it ourselves if needed, and fail loudly if it still isn't public.
          for attempt in 1 2 3 4 5 6; do
            draft=$(gh release view nightly --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
            if [ "$draft" = false ]; then echo "Nightly ${SHA::7} is published."; exit 0; fi
            echo "Nightly is not public yet (isDraft=$draft, attempt $attempt); publishing it."
            gh release edit nightly --repo "$REPO" --draft=false --prerelease --latest=false || true
            sleep 5
          done
          echo "::error::The nightly release is still not public after publishing it 6 times."
          exit 1
