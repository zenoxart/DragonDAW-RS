name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Security: CI only reads the repository (it also runs for pull requests from forks).
# Actions are pinned to commit SHAs; Dependabot keeps them up to date.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; pinned, so the toolchain is given via `toolchain:`
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux:
    name: Test (Linux, with plugin host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config xvfb libx11-6 libxkbcommon0 libgl1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; pinned, so the toolchain is given via `toolchain:`
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The test plugins (CLAP/VST3 cdylibs) are built first so the host tests can load them;
      # their editor windows need an X server, hence Xvfb.
      - run: cargo build -p dragon-test-plugins --locked
      - run: xvfb-run -a cargo test --workspace --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; pinned, so the toolchain is given via `toolchain:`
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
      # Windows: load the in-repo CLAP / VST3 test plugins through the host and embed their editors into
      # real Win32 windows (HWND parenting, resize, GUI → host parameter edits).
      - name: Plugin host tests
        if: runner.os == 'Windows'
        run: |
          cargo build -p dragon-test-plugins --locked
          cargo test -p dragon-test-plugins --locked
      # Close test on a real Windows desktop: the app opens the demo, plays, opens a plugin's own window
      # and closes itself; it must exit cleanly (the "crash on close" scenario), three times.
      - name: Close smoke test (plugin window open)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p dragon-daw --locked
          Copy-Item target/debug/dragon_test_plugins.dll "$env:RUNNER_TEMP/dragon_test.clap"
          $env:DRAGON_STARTUP_COMMANDS = "file.new_demo,transport.play"
          $env:DRAGON_SMOKE_PLUGIN = "$env:RUNNER_TEMP/dragon_test.clap"
          $env:DRAGON_SMOKE_CLOSE_AFTER = "8"
          $err = Join-Path $env:RUNNER_TEMP "dragon-smoke-err.txt"
          foreach ($run in 1..3) {
            $p = Start-Process -FilePath target/debug/dragon-daw.exe -PassThru -NoNewWindow -RedirectStandardError $err
            if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "run ${run}: the app did not close" }
            if ($p.ExitCode -ne 0) {
              # GitHub's Windows runners have no OpenGL 2.0: the window can't open at all there, so the
              # close test can't run (a real crash or a bad exit still fails the step).
              if ((Get-Content $err -Raw) -match "requires opengl 2\.0") {
                Write-Host "::warning::Close smoke test skipped: this runner has no OpenGL 2.0, so the app window cannot open"
                exit 0
              }
              Get-Content $err | Select-Object -Last 20
              throw "run ${run}: exit code $($p.ExitCode)"
            }
            Write-Host "run ${run}: closed cleanly"
          }
          $crash = Join-Path $env:LOCALAPPDATA "DragonDAW/Crash/last-crash.txt"
          if (Test-Path $crash) { Get-Content $crash; throw "a crash report was written" }

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; pinned, so the toolchain is given via `toolchain:`
        with:
          toolchain: '1.89' # MSRV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --locked
