version: 2
updates:
  # Minor and patch updates only, grouped into one weekly PR. Major versions change APIs
  # (symphonia, rubato, cpal, egui …) and are upgraded by hand.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # All actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
    # dtolnay/rust-toolchain is pinned to its master branch; the toolchain comes from `toolchain:`.
