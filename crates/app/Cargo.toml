[package]
name = "dragon-daw"
description = "Dragon DAW – an offline digital audio workstation built on the Red Hive desktop framework: record, make beats, mix and master."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dragon-daw"
path = "src/main.rs"

[dependencies]
redhive-client-framework.workspace = true
redhive-contracts.workspace = true
redhive-monads.workspace = true
dragon-engine = { workspace = true, features = ["device", "plugins"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland"] }
egui = "0.31"
egui_dock = { version = "0.16", features = ["serde"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
