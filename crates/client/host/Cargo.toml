[package]
name = "redhive-host"
description = "Red Hive desktop host – the long-running shell that loads modules from the server."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "redhive"
path = "src/main.rs"

[dependencies]
redhive-client-framework.workspace = true
redhive-contracts.workspace = true
redhive-monads.workspace = true
base64.workspace = true
chrono.workspace = true
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland"] }
egui = "0.31"
egui_dock = { version = "0.16", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
